services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_gis}
      POSTGRES_USER: ${POSTGRES_USER:-web_gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web_gis}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-web_gis} -d ${POSTGRES_DB:-web_gis}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      VITE_API_URL: http://127.0.0.1:8000
      VITE_ENABLE_MOCK_FALLBACK: true
      VITE_MOCK_FALLBACK_MODULES: reports,exports
      FRONTEND_PORT: 5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
      - '5173:5173'
    volumes:
      - ./:/workspace
      - node_modules:/workspace/node_modules

volumes:
  pg_data:
  node_modules:
