services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env.production}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env.production}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_RUN_MODE: production
      DJANGO_COLLECTSTATIC: 'true'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GIS_API_URL: ${VITE_GIS_API_URL:-/gis-api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Система учета повреждений теплосетей}
        VITE_ENABLE_MOCK_FALLBACK: ${VITE_ENABLE_MOCK_FALLBACK:-false}
        VITE_MOCK_FALLBACK_MODULES: ${VITE_MOCK_FALLBACK_MODULES:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    volumes:
      - django_static:/srv/django-static:ro
    networks:
      - backend
      - frontend

volumes:
  pg_data:
  django_static:

networks:
  backend:
    internal: true
  frontend:
